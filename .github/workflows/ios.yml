name: Native iOS validation
on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'iOS/**'
      - 'Tests/**'
      - 'iOSUITests/**'
      - 'Scripts/**'
      - 'Configuration/**'
      - 'Package.swift'
      - 'DigitalWorld.xcodeproj/**'
      - '.github/workflows/ios.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      release_only:
        description: Run only the Release build
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    if: ${{ !inputs.release_only }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated content and project
        run: |
          python3 Scripts/build_content.py
          python3 Scripts/validate_assets.py
          python3 Scripts/generate_project.py
          python3 Scripts/validate_project.py
          python3 Scripts/validate_localization.py
          git diff --exit-code
      - name: Test deterministic game core
        run: swift test
  ios:
    if: ${{ !inputs.release_only }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iPhone simulator
        timeout-minutes: 3
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j'], timeout=90))['devices']
          candidates=[d for runtime, values in devices.items() if 'iOS' in runtime for d in values if d['name'].startswith('iPhone')]
          if not candidates:
              raise SystemExit('No iOS simulator is installed on this runner')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('SIMULATOR_ID='+candidates[0]['udid']+'\n')
          PY
      - name: Compile native application and test runner
        timeout-minutes: 8
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project DigitalWorld.xcodeproj -scheme DigitalWorld \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/DerivedData -resultBundlePath build/NativeBuild.xcresult \
            CODE_SIGNING_ALLOWED=NO | tee build-ios.log
      - name: Exercise native application
        timeout-minutes: 15
        run: |
          set -o pipefail
          xcodebuild test-without-building -project DigitalWorld.xcodeproj -scheme DigitalWorld \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/DerivedData -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 180 -resultBundlePath build/NativeTests.xcresult \
            CODE_SIGNING_ALLOWED=NO | tee test-ios.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ios-validation
          path: |
            build-ios.log
            test-ios.log
            build/NativeBuild.xcresult
            build/NativeTests.xcresult
  release:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile release application
        run: |
          set -o pipefail
          xcodebuild build -project DigitalWorld.xcodeproj -scheme DigitalWorld \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tee build-release.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-validation
          path: build-release.log
