name: 打包真机IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 编译未签名真机应用
        run: |
          set -o pipefail
          xcodebuild build -project DigitalWorld.xcodeproj -scheme DigitalWorld \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/Device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | tee build-device.log
      - name: 校验真机平台并打包IPA
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, plistlib, re, shutil, subprocess, zipfile
          app = pathlib.Path('build/Device/Build/Products/Release-iphoneos/DigitalWorld.app')
          info = plistlib.loads((app/'Info.plist').read_bytes())
          version = info['CFBundleShortVersionString']
          assert re.fullmatch(r'\d+\.\d+\.\d+',version), '版本格式错误'
          assert info['CFBundleSupportedPlatforms'] == ['iPhoneOS'], '必须为真机平台'
          binary = app/info['CFBundleExecutable']
          arch = subprocess.check_output(['lipo','-archs',str(binary)],text=True).strip()
          assert arch == 'arm64', f'真机架构错误：{arch}'
          platform = subprocess.check_output(['xcrun','vtool','-show-build',str(binary)],text=True)
          assert re.search(r'^\s*platform\s+IOS\s*$',platform,re.M), '不能把模拟器应用作为IPA发布'
          assert not (app/'embedded.mobileprovision').exists(), '本流程不得包含个人描述文件'
          out = pathlib.Path('dist'); out.mkdir(exist_ok=True)
          payload = pathlib.Path('build/IPAPackage/Payload'); payload.mkdir(parents=True,exist_ok=True)
          subprocess.check_call(['ditto',str(app),str(payload/app.name)])
          ipa = out/f'DigitalWorld-v{version}-unsigned.ipa'
          subprocess.check_call(['ditto','-c','-k','--keepParent','Payload',str(ipa.resolve())],cwd=payload.parent)
          with zipfile.ZipFile(ipa) as archive:
              assert archive.testzip() is None, 'IPA压缩校验失败'
              prefix = 'Payload/DigitalWorld.app/'
              assert prefix+'Info.plist' in archive.namelist()
              assert prefix+info['CFBundleExecutable'] in archive.namelist()
              assert any(n.endswith('database.json') for n in archive.namelist()), '缺少游戏内容'
          checksum = hashlib.sha256(ipa.read_bytes()).hexdigest()
          (out/(ipa.name+'.sha256')).write_text(checksum+'  '+ipa.name+'\n')
          metadata = dict(version=version,build=info['CFBundleVersion'],commit=os.environ['GITHUB_SHA'],
              bundleIdentifier=info['CFBundleIdentifier'],minimumOS=info['MinimumOSVersion'],
              architecture=arch,platform='iPhoneOS',signing='unsigned',sha256=checksum,bytes=ipa.stat().st_size)
          (out/'build-info.json').write_text(json.dumps(metadata,ensure_ascii=False,indent=2)+'\n')
          notes = f'''## v{version} 开发测试包

          - 真机arm64 / iOS {info['MinimumOSVersion']}及以上。
          - 未签名IPA，需使用自己的签名工具与签名资料签名后安装；不能直接点开安装。
          - 包含当前Ver.1养成、原版彩色角色、顺序Quest及本机开发测试功能。
          - 提供SHA-256及构建信息；应用源码提交：{os.environ['GITHUB_SHA']}。
          - 已通过真机SDK编译与包结构校验，尚未完成真实iPhone签名安装验收。

          从Assets下载以`.ipa`结尾的文件；Source code压缩包是源码。
          '''
          (out/'RELEASE_NOTES.md').write_text(notes)
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('RELEASE_TAG=v'+version+'\n')
              env.write('APP_VERSION='+version+'\n')
          print(json.dumps(metadata,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-iphoneos-ipa
          if-no-files-found: error
          path: |
            dist/*.ipa
            dist/*.sha256
            dist/build-info.json
      - name: 发布开发测试包
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.ipa dist/*.sha256 dist/build-info.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$APP_VERSION 开发测试版（未签名）" \
            --notes-file dist/RELEASE_NOTES.md --prerelease --draft
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-build-log
          path: build-device.log
